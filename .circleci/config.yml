version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:lts
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci

      - run:
          name: Build site
          command: npm run build

      - run:
          name: Internal link check
          command: npm run linkcheck:internal

      - run:
          name: Rebuild site for CircleCI preview
          # Prefix all asset and page URLs with the artifact path so images,
          # CSS and links resolve correctly in CircleCI's artifact viewer.
          command: |
            ASTRO_BASE="/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/0/html" \
              npm run build

      - store_artifacts:
          path: ~/repo/html
          destination: html

workflows:
  build_website:
    jobs:
      - build
