version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:lts
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Astro build
          command: npm run build
      - store_artifacts:
          path: ~/repo/html
          destination: html

workflows:
  build_website:
    jobs:
      - build
