name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "1 00 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main part-way through deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint source
        run: npm run lint -- --max-warnings=0
      - name: Lint Markdown
        run: npm run lint:md
      - name: Astro type check
        run: npm run astro:check
      - name: Run unit tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Check Matrix discovery files are in the build
        run: test -f html/.well-known/matrix/server && test -f html/.well-known/matrix/client
      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --root-dir "${{ github.workspace }}/html"
            --remap "^https://openastronomy\.org/(.*)$ file://${{ github.workspace }}/html/\$1"
            html
      - name: Upload Pages artifact
        if: github.repository == 'OpenAstronomy/openastronomy.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: html/
          # Keeps .well-known/matrix (Matrix federation for openastronomy.org).
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'OpenAstronomy/openastronomy.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
