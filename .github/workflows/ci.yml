name: Lint and Link Checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and Astro checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run format and autofix steps
        run: |
          npm run format
          npm run lint:fix
          npm run lint:md:fix
      - name: Ensure formatting and fixes are committed
        run: |
          if ! git diff --quiet; then
            echo "Formatting/lint fixes produced changes. Please run:";
            echo "  npm run format";
            echo "  npm run lint:fix";
            echo "  npm run lint:md:fix";
            echo "and commit the results."
            git --no-pager diff --stat
            exit 1
          fi
      - name: Check formatting
        run: npm run format:check
      - name: Lint source
        run: npm run lint
      - name: Lint Markdown
        run: npm run lint:md
      - name: Astro checks
        run: npm run astro:check
      - name: Unit tests
        run: npm test

  linkcheck:
    name: Link check (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        mode:
          - internal
          - external
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Run link checks
        run: npm run linkcheck:${{ matrix.mode }}
